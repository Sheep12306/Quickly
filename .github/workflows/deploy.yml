name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps & build
        working-directory: front
        run: |
          npm ci
          npm run build

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          source: "front/dist,front/package.json,front/package-lock.json"
          target: /opt/quickly/front
          strip_components: 1
          overwrite: true

      - name: Install & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /opt/quickly/front

            # Older deploys may have put the SQLite DB under dist/; keep it.
            if [ -f dist/data/quickly.db ] && [ ! -f data/quickly.db ]; then
              mkdir -p data
              cp -a dist/data/. data/
            fi

            npm ci --omit=dev 2>/dev/null || npm install --omit=dev

            # Start from the project root: server.cjs resolves the frontend at
            # cwd/dist and the SQLite DB at cwd/data.
            pm2 delete quickly 2>/dev/null || true
            PORT=3002 NODE_OPTIONS=--experimental-sqlite pm2 start dist/server.cjs --name quickly
            pm2 save
